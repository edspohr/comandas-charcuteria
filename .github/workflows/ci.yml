# Typecheck + build + rules tests on every push / PR. The rules tests need
# the Firestore emulator (Java).
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx tsc -p functions --noEmit
      - run: npm --workspace app run build
      - run: npx firebase-tools@14 emulators:exec --only firestore --project comandas-rules-test "npm run test:rules"
